version: '3.8'

services:
  # Container 1: The Database
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password2026
    ports:
      - "1433:1433"
    networks:
      - glms-network

  # Container 2: The Web API
  glms-backend-api:
    image: glms-backend-api
    container_name: glms-backend-api
    build:
      context: ./ERP.Api
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=GLMSDb;User Id=sa;Password=YourStrong@Password2026;TrustServerCertificate=True;
    ports:
      - "5001:8080"
    depends_on:
      - sql-server-db
    networks:
      - glms-network

  # Container 3: The MVC Frontend Web App
  glms-frontend-web:
    image: glms-frontend-web
    container_name: glms-frontend-web
    build:
      context: .                 
      dockerfile: ERP/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://glms-backend-api:8080/
    ports:
      - "5000:8080"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge